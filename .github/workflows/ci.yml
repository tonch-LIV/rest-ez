name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - run: npx --yes npm@11.6.0 ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build